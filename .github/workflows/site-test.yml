name: Site test (PR)

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - 'catalog.json'
      - 'ui-design/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/site-test.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run verify
